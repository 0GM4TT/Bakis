[master]
#replace host IPs with the ones assigned to the PIs
k3s-master ansible_host=192.168.50.200

[workers]
#replace host IPs with the ones assigned to the PIs
k3s-worker1 ansible_host=192.168.50.201
k3s-worker2 ansible_host=192.168.50.202

[cluster:children]
master
workers

[cluster:vars]
#replace with your actual pi's user to log-in for the first time for ssh key distribution
ansible_user=msm
ansible_ssh_private_key_file=~/.ssh/ansible_id
ansible_python_interpreter=/usr/bin/python3

# VM nodes - accessible via NodePort on master
[vms]
ubuntu-vm-1 ansible_host=192.168.50.200 ansible_port=30001 ansible_user=ubuntu
ubuntu-vm-2 ansible_host=192.168.50.200 ansible_port=30002 ansible_user=ubuntu

[vms:vars]
ansible_ssh_private_key_file=~/.ssh/ansible_id
ansible_python_interpreter=/usr/bin/python3