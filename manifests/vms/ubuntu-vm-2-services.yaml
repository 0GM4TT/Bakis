---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-vm-2-ssh
  namespace: default
spec:
  type: NodePort
  selector:
    kubevirt.io/domain: ubuntu-vm-2
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30002

---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-vm-2-http
  namespace: default
spec:
  type: NodePort
  selector:
    kubevirt.io/domain: ubuntu-vm-2
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30012