---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-vm-1-ssh
  namespace: default
spec:
  type: NodePort
  selector:
    kubevirt.io/domain: ubuntu-vm-1
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30001

---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-vm-1-http
  namespace: default
spec:
  type: NodePort
  selector:
    kubevirt.io/domain: ubuntu-vm-1
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30011