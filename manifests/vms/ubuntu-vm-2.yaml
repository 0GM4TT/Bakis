---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu-vm-2
  namespace: default
  labels:
    app: ubuntu-vm
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: ubuntu-vm-2
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 512Mi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 512Mi
            cpu: "1"
      networks:
        - name: default
          pod: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k3s-master    
      volumes:
        - name: rootdisk
          dataVolume:
            name: ubuntu-vm-2-disk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: ubuntu-vm-2
              user: ubuntu
              password: ubuntu123
              chpasswd:
                expire: false
              ssh_pwauth: true
              ssh_authorized_keys:
              # Replace with your own public key (cat ~/.ssh/ansible_id.pub)
                - ssh-rsa  ansible-jumphost
              write_files:
                - path: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
                  content: |
                    network: {config: disabled}
                - path: /etc/netplan/99-kubevirt.yaml
                  content: |
                    network:
                      version: 2
                      ethernets:
                        enp1s0:
                          dhcp4: true
                          dhcp6: true
              bootcmd:
                - rm -f /etc/netplan/50-cloud-init.yaml             
  dataVolumeTemplates:
    - metadata:
        name: ubuntu-vm-2-disk
      spec:
        storage:
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: 5Gi
          storageClassName: longhorn
        source:
          http:
            url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-arm64.img"