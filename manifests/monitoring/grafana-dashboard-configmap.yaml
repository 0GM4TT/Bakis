          "targets": [
            {
              "expr": "avg(100 * (1 - node_memory_MemAvailable_bytes{instance=~'192.168.50.(200|201|202):9100'} / node_memory_MemTotal_bytes{instance=~'192.168.50.(200|201|202):9100'}))",
