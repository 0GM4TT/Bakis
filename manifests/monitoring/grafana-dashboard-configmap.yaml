---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    grafana_dashboard_provider: "1"
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: arm-microcluster
        orgId: 1
        folder: ARM Microcluster
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/arm-microcluster

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-arm-microcluster
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  arm-microcluster.json: |
    {
      "title": "ARM Microcluster \u2014 Overview",
      "uid": "arm-microcluster-overview",
      "tags": [
        "kubernetes",
        "kubevirt",
        "longhorn",
        "arm"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "title": "Nodes Ready",
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              },
              "mappings": []
            }
          },
          "targets": [
            {
              "expr": "sum(kube_node_status_condition{condition='Ready',status='true'})",
              "legendFormat": "Ready"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "title": "VMs Running",
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              },
              "mappings": []
            }
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase='Running'} == 1 and on(pod) kube_pod_info{created_by_kind='VirtualMachineInstance'})",
              "legendFormat": "Running"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "title": "Cluster CPU avg",
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "mappings": []
            }
          },
          "targets": [
            {
              "expr": "avg(100 - (avg by (instance) (rate(node_cpu_seconds_total{mode='idle',instance=~'192.168.50.(200|201|202):9100'}[5m])) * 100))",
              "legendFormat": "CPU %"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 3
          },
